<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderneta do Pet</title>
<meta name="theme-color" content="#E8734A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Pet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --ink:#2E2520; --muted:#857A71; --line:#EDE4DA;
  --accent:#E8734A; --accent-soft:#FCE6DC; --teal:#2F8F83; --teal-soft:#DDF1EE;
  --warn:#C9821B; --warn-soft:#FBEFD9; --danger:#C44536; --danger-soft:#F8DEDA;
  --shadow:0 2px 10px rgba(70,45,25,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B1714; --card:#26201C; --ink:#F3ECE5; --muted:#A99D93; --line:#3A312B;
    --accent:#F08A62; --accent-soft:#4A2D22; --teal:#5BC0B2; --teal-soft:#1F3936;
    --warn:#E5A84A; --warn-soft:#43341B; --danger:#E77464; --danger-soft:#47231F;
    --shadow:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
h1,h2,h3{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:16px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Fredoka';font-size:20px;font-weight:600}
.brand svg{width:28px;height:28px}
.pet-switch{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pet-switch::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{display:flex;gap:16px;align-items:center}
.photo{width:92px;height:92px;border-radius:24px;flex:none;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo svg{width:48px;height:48px;color:var(--accent)}
.hero h1{font-size:26px;line-height:1.1}
.hero .sub{color:var(--muted);font-size:14px;margin-top:4px}
.age{display:inline-block;margin-top:8px;background:var(--teal-soft);color:var(--teal);font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px}
.linkbtn{color:var(--accent);font-weight:800;font-size:14px}

.section-h{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
.section-h h2{font-size:19px}

/* listas */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none;padding-top:2px}
.ico{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:19px}
.ico.vacina{background:var(--teal-soft)} .ico.remedio{background:var(--accent-soft)}
.ico.consulta{background:var(--warn-soft)} .ico.banho{background:#E3ECFB} .ico.nota{background:var(--line)}
@media (prefers-color-scheme: dark){.ico.banho{background:#22304A}}
.item .t{font-weight:800}
.item .d{color:var(--muted);font-size:14px}
.item .body{flex:1;min-width:0}
.item .body .x{font-size:14px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.item .edit{color:var(--muted);font-size:13px;font-weight:700;padding:4px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:5px}
.tag.ok{background:var(--teal-soft);color:var(--teal)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:15px}

/* abas internas */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;font-weight:800;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.teal{background:var(--teal)}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* barra inferior */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:800;color:var(--muted);border-radius:12px}
nav.tabs button .e{font-size:21px;line-height:1;filter:grayscale(.6);opacity:.75}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .e{filter:none;opacity:1}

/* folha (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,8,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:21px;margin-bottom:12px}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-weight:800;font-size:14px;margin-bottom:5px}
label.f input,label.f select,label.f textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
label.f textarea{min-height:80px;resize:vertical}
label.f small{color:var(--muted);font-size:12.5px}
.danger-link{color:var(--danger);font-weight:800;font-size:14px;display:block;margin:14px auto 0}

/* clínicas */
.clin .nm{font-weight:800}
.clin .acts{display:flex;gap:8px;margin-top:8px}
.clin .acts a{flex:1;text-align:center;padding:8px;border-radius:10px;font-weight:800;font-size:14px;text-decoration:none;background:var(--accent-soft);color:var(--accent)}
.clin .acts a.call{background:var(--teal-soft);color:var(--teal)}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:14px auto}
@keyframes s{to{transform:rotate(360deg)}}

.welcome{text-align:center;padding:30px 10px}
.welcome .big{width:110px;height:110px;margin:0 auto 14px;border-radius:32px;background:var(--accent-soft);display:grid;place-items:center}
.welcome .big svg{width:64px;height:64px;color:var(--accent)}
.welcome h1{font-size:28px;margin-bottom:6px}
.welcome p{color:var(--muted);margin-bottom:22px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" id="tabs">
  <div class="in">
    <button data-tab="inicio"><span class="e">🏠</span>Início</button>
    <button data-tab="saude"><span class="e">💉</span>Saúde</button>
    <button data-tab="banho"><span class="e">🛁</span>Banho</button>
    <button data-tab="historico"><span class="e">📖</span>Histórico</button>
    <button data-tab="clinicas"><span class="e">🏥</span>24h</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<input type="file" id="importFile" accept="application/json" class="hidden">

<script>
/* ---------- ícone de pata ---------- */
const PAW = `<svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><ellipse cx="18" cy="24" rx="6.5" ry="8.5"/><ellipse cx="32" cy="16" rx="6.5" ry="8.5"/><ellipse cx="46" cy="24" rx="6.5" ry="8.5"/><ellipse cx="10" cy="37" rx="5.5" ry="7"/><ellipse cx="54" cy="37" rx="5.5" ry="7"/><path d="M32 30c-9 0-17 10-17 18 0 6 5 8 9 8 3 0 5-2 8-2s5 2 8 2c4 0 9-2 9-8 0-8-8-18-17-18z"/></svg>`;

/* ---------- dados ---------- */
const KEY = 'caderneta-pet-v1';
let db = load();
let tab = 'inicio', saudeSub = 'vacina';
let clinState = {status:'idle', list:[], lat:null, lng:null, msg:''};

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {pets:[], atual:null}; }
  catch(e){ return {pets:[], atual:null}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('Não consegui salvar. O armazenamento do navegador pode estar cheio (fotos ocupam espaço).'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const pet = () => db.pets.find(p => p.id === db.atual) || db.pets[0];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- datas ---------- */
const hoje = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmt = s => { const d = parseD(s); return d ? d.toLocaleDateString('pt-BR') : ''; };
const diasAte = s => Math.round((parseD(s) - hoje()) / 86400000);
function idade(nasc){
  const n = parseD(nasc); if(!n) return '';
  const h = hoje(); let meses = (h.getFullYear()-n.getFullYear())*12 + (h.getMonth()-n.getMonth());
  if(h.getDate() < n.getDate()) meses--;
  if(meses < 0) return '';
  if(meses < 1){ const d = Math.round((h-n)/86400000); return d + (d===1?' dia':' dias'); }
  if(meses < 12) return meses + (meses===1?' mês':' meses');
  const a = Math.floor(meses/12), r = meses%12;
  return a + (a===1?' ano':' anos') + (r ? ` e ${r} ${r===1?'mês':'meses'}` : '');
}
function prazoTag(s, rotulo='Próxima'){
  if(!s) return '';
  const d = diasAte(s);
  if(d < 0) return `<span class="tag late">${rotulo} atrasada há ${-d} ${-d===1?'dia':'dias'}</span>`;
  if(d === 0) return `<span class="tag warn">${rotulo}: hoje</span>`;
  if(d <= 15) return `<span class="tag warn">${rotulo} em ${d} ${d===1?'dia':'dias'} · ${fmt(s)}</span>`;
  return `<span class="tag ok">${rotulo}: ${fmt(s)}</span>`;
}

/* ---------- tipos de registro ---------- */
const TIPOS = {
  vacina:  {nome:'Vacina', plural:'Vacinas', e:'💉', campos:[
    {k:'titulo', l:'Vacina', ph:'Ex.: V10, Antirrábica, Gripe', req:1},
    {k:'data', l:'Data da aplicação', t:'date', req:1},
    {k:'proxima', l:'Próxima dose (reforço)', t:'date'},
    {k:'local', l:'Clínica / veterinário', ph:'Opcional'},
    {k:'obs', l:'Observações', t:'area', ph:'Lote, reação, etc.'}]},
  remedio: {nome:'Remédio', plural:'Remédios', e:'💊', campos:[
    {k:'titulo', l:'Remédio', ph:'Ex.: Vermífugo, Antipulgas, Antibiótico', req:1},
    {k:'dose', l:'Dose', ph:'Ex.: 1 comprimido, 5 gotas'},
    {k:'freq', l:'Frequência', ph:'Ex.: de 12 em 12 horas, 1x por mês'},
    {k:'data', l:'Início', t:'date', req:1},
    {k:'fim', l:'Término', t:'date', hint:'Deixe vazio se for de uso contínuo'},
    {k:'proxima', l:'Próxima aplicação', t:'date', hint:'Para vermífugo, antipulgas e afins'},
    {k:'obs', l:'Observações', t:'area'}]},
  consulta:{nome:'Consulta', plural:'Consultas', e:'🩺', campos:[
    {k:'titulo', l:'Motivo', ph:'Ex.: Check-up, Vômito, Castração', req:1},
    {k:'data', l:'Data', t:'date', req:1},
    {k:'local', l:'Clínica / veterinário'},
    {k:'peso', l:'Peso (kg)', t:'number', ph:'Opcional'},
    {k:'proxima', l:'Retorno', t:'date'},
    {k:'obs', l:'O que o veterinário disse', t:'area', ph:'Diagnóstico, exames, recomendações'}]},
  banho:   {nome:'Banho/Tosa', plural:'Banhos e tosas', e:'🛁', campos:[
    {k:'titulo', l:'Serviço', t:'select', op:['Banho','Banho e tosa','Tosa','Tosa higiênica'], req:1},
    {k:'data', l:'Data', t:'date', req:1},
    {k:'local', l:'Pet shop / local', ph:'Opcional'},
    {k:'valor', l:'Valor (R$)', t:'number', ph:'Opcional'},
    {k:'proxima', l:'Próximo agendado', t:'date'},
    {k:'obs', l:'Observações', t:'area'}]},
  nota:    {nome:'Anotação', plural:'Anotações', e:'📝', campos:[
    {k:'titulo', l:'Título', ph:'Ex.: Trocou de ração, Primeiro passeio', req:1},
    {k:'data', l:'Data', t:'date', req:1},
    {k:'obs', l:'Detalhes', t:'area'}]}
};
const regs = (tipo) => (pet()?.registros || []).filter(r => !tipo || r.tipo === tipo)
  .sort((a,b) => (b.data||'').localeCompare(a.data||''));

/* ---------- foto ---------- */
function lerFoto(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 480, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .82));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ---------- render ---------- */
const $app = document.getElementById('app');
function render(){
  document.getElementById('tabs').classList.toggle('hidden', !db.pets.length);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if(!db.pets.length){ $app.innerHTML = welcome(); return; }
  const v = {inicio, saude, banho:banhoV, historico, clinicas}[tab]();
  $app.innerHTML = topo() + v;
}

function welcome(){
  return `<div class="welcome">
    <div class="big">${PAW}</div>
    <h1>Caderneta do Pet</h1>
    <p>Vacinas, remédios, consultas e banhos do seu pet, tudo num lugar só.</p>
    <button class="btn" onclick="formPet()">Cadastrar meu pet</button>
    <button class="btn ghost" style="margin-top:10px" onclick="importar()">Restaurar backup</button>
  </div>`;
}

function topo(){
  const chips = db.pets.length > 1 ? `<div class="pet-switch">${db.pets.map(p =>
    `<button class="chip ${p.id===pet().id?'on':''}" onclick="trocaPet('${p.id}')">${esc(p.nome)}</button>`).join('')}</div>` : '';
  return `<div class="top"><div class="brand"><span style="color:var(--accent)">${PAW}</span>Caderneta do Pet</div>${chips}</div>`;
}

function itemHTML(r, opts={}){
  const T = TIPOS[r.tipo];
  const linhas = [];
  if(r.dose || r.freq) linhas.push([r.dose, r.freq].filter(Boolean).join(' · '));
  if(r.local) linhas.push(r.local);
  if(r.peso) linhas.push(`Peso: ${r.peso} kg`);
  if(r.valor) linhas.push(`R$ ${Number(r.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}`);
  if(r.obs) linhas.push(r.obs);
  let tag = '';
  if(r.tipo === 'remedio'){
    if(r.proxima) tag = prazoTag(r.proxima);
    else if(r.fim && diasAte(r.fim) < 0) tag = `<span class="tag ok">Concluído em ${fmt(r.fim)}</span>`;
    else tag = `<span class="tag warn">Em uso${r.fim ? ' até ' + fmt(r.fim) : ' (contínuo)'}</span>`;
  } else if(r.proxima) tag = prazoTag(r.proxima, r.tipo==='consulta' ? 'Retorno' : 'Próxima');
  return `<div class="item">
    <div class="ico ${r.tipo}">${T.e}</div>
    <div class="body">
      <div class="t">${esc(r.titulo)}</div>
      <div class="d">${opts.showTipo ? T.nome + ' · ' : ''}${fmt(r.data)}${r.tipo==='remedio' && r.data ? ' (início)' : ''}</div>
      ${linhas.length ? `<div class="x">${esc(linhas.join('\n'))}</div>` : ''}
      ${opts.noTag ? '' : tag}
    </div>
    <button class="edit" onclick="formReg('${r.tipo}','${r.id}')">Editar</button>
  </div>`;
}

function inicio(){
  const p = pet();
  const foto = p.foto ? `<img src="${p.foto}" alt="Foto de ${esc(p.nome)}">` : PAW;
  const det = [p.especie, p.raca].filter(Boolean).join(' · ');
  // próximos compromissos
  const prox = (p.registros||[]).filter(r => r.proxima && diasAte(r.proxima) <= 30)
    .sort((a,b) => a.proxima.localeCompare(b.proxima));
  const emUso = (p.registros||[]).filter(r => r.tipo==='remedio' && !r.proxima && (!r.fim || diasAte(r.fim) >= 0));
  const proxHTML = prox.length ? prox.map(r => {
      const rot = {vacina:'Vacina', remedio:'Remédio', consulta:'Retorno', banho:'Banho', nota:'Lembrete'}[r.tipo];
      return `<div class="item"><div class="ico ${r.tipo}">${TIPOS[r.tipo].e}</div><div class="body">
        <div class="t">${esc(r.titulo)}</div><div class="d">${rot}</div>${prazoTag(r.proxima, 'Data')}</div></div>`;
    }).join('') : `<div class="empty">Nada marcado para os próximos 30 dias 🎉</div>`;
  const usoHTML = emUso.length ? `<div class="section-h"><h2>Remédios em uso</h2></div>
    <div class="card">${emUso.map(r => itemHTML(r)).join('')}</div>` : '';
  const ultimos = regs().slice(0,3);
  return `
  <div class="card hero">
    <div class="photo">${foto}</div>
    <div style="flex:1;min-width:0">
      <h1>${esc(p.nome)}</h1>
      ${det ? `<div class="sub">${esc(det)}</div>` : ''}
      ${p.nascimento ? `<div class="sub">Nasceu em ${fmt(p.nascimento)}</div><span class="age">${idade(p.nascimento)}</span>` : ''}
      <div style="margin-top:8px"><button class="linkbtn" onclick="formPet('${p.id}')">Editar perfil</button></div>
    </div>
  </div>

  <div class="section-h"><h2>Próximos 30 dias</h2></div>
  <div class="card">${proxHTML}</div>
  ${usoHTML}

  <div class="section-h"><h2>Registrar</h2></div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost" onclick="formReg('vacina')">💉 Vacina</button>
    <button class="btn ghost" onclick="formReg('remedio')">💊 Remédio</button>
  </div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost" onclick="formReg('consulta')">🩺 Consulta</button>
    <button class="btn ghost" onclick="formReg('banho')">🛁 Banho</button>
  </div>
  <button class="btn ghost" onclick="formReg('nota')">📝 Anotação</button>

  ${ultimos.length ? `<div class="section-h"><h2>Últimos registros</h2><button class="linkbtn" onclick="ir('historico')">Ver tudo</button></div>
  <div class="card">${ultimos.map(r => itemHTML(r,{showTipo:1, noTag:1})).join('')}</div>` : ''}

  <div class="section-h"><h2>Mais</h2></div>
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost" onclick="formPet()">➕ Outro pet</button>
    <button class="btn ghost" onclick="exportar()">💾 Backup</button>
  </div>
  <button class="btn ghost" onclick="importar()">📂 Restaurar backup</button>
  <p class="note" style="text-align:center">Os dados ficam guardados neste aparelho. Faça backup de vez em quando.</p>`;
}

function saude(){
  const T = TIPOS[saudeSub], lista = regs(saudeSub);
  return `<div class="seg">
    ${['vacina','remedio','consulta'].map(k => `<button class="${saudeSub===k?'on':''}" onclick="saudeSub='${k}';render()">${TIPOS[k].plural}</button>`).join('')}
  </div>
  <button class="btn" onclick="formReg('${saudeSub}')">+ Adicionar ${T.nome.toLowerCase()}</button>
  <div class="card" style="margin-top:14px">${lista.length ? lista.map(r => itemHTML(r)).join('') :
    `<div class="empty">Nenhum registro de ${T.plural.toLowerCase()} ainda.</div>`}</div>`;
}

function banhoV(){
  const lista = regs('banho');
  const ult = lista[0];
  const dias = ult ? -diasAte(ult.data) : null;
  const resumo = ult ? `<div class="card"><div class="d" style="color:var(--muted);font-size:14px">Último banho/tosa</div>
     <div style="font-family:Fredoka;font-size:22px;font-weight:600">${dias===0?'Hoje':dias===1?'Ontem':`Há ${dias} dias`}</div>
     <div style="color:var(--muted);font-size:14px">${esc(ult.titulo)} em ${fmt(ult.data)}</div></div>` : '';
  return `<h2 style="margin:0 4px 12px">Banho e tosa</h2>${resumo}
  <button class="btn" onclick="formReg('banho')">+ Registrar banho ou tosa</button>
  <div class="card" style="margin-top:14px">${lista.length ? lista.map(r => itemHTML(r)).join('') :
    `<div class="empty">Nenhum banho registrado ainda.</div>`}</div>`;
}

function historico(){
  const lista = regs();
  if(!lista.length) return `<h2 style="margin:0 4px 12px">Histórico</h2><div class="card"><div class="empty">O histórico aparece aqui conforme você registra vacinas, remédios, consultas e banhos.</div></div>`;
  // agrupa por mês
  const grupos = {};
  lista.forEach(r => { const k = (r.data||'').slice(0,7); (grupos[k] = grupos[k] || []).push(r); });
  return `<h2 style="margin:0 4px 12px">Histórico de ${esc(pet().nome)}</h2>
  <button class="btn ghost" onclick="formReg('nota')" style="margin-bottom:6px">📝 Adicionar anotação</button>` +
  Object.keys(grupos).sort().reverse().map(k => {
    const [y,m] = k.split('-').map(Number);
    const nome = k ? new Date(y, m-1, 1).toLocaleDateString('pt-BR',{month:'long', year:'numeric'}) : 'Sem data';
    return `<div class="section-h"><h2 style="font-size:16px;text-transform:capitalize">${nome}</h2></div>
      <div class="card">${grupos[k].map(r => itemHTML(r,{showTipo:1, noTag:1})).join('')}</div>`;
  }).join('');
}

function clinicas(){
  const s = clinState;
  let corpo = '';
  if(s.status === 'loading') corpo = `<div class="card"><div class="spinner"></div><div class="empty" style="padding-top:0">${esc(s.msg)}</div></div>`;
  else if(s.status === 'error') corpo = `<div class="card"><div class="empty">${esc(s.msg)}</div>${s.ajuda ? `<p class="note" style="margin-top:0;text-align:center">${esc(s.ajuda)}</p>` : ''}</div>`;
  else if(s.status === 'done'){
    const l = s.list;
    corpo = l.length ? `<div class="card">${l.map(c => `
      <div class="item clin"><div class="ico consulta">🏥</div><div class="body">
        <div class="nm">${esc(c.nome)}</div>
        <div class="d">${c.dist.toFixed(1).replace('.',',')} km${c.end ? ' · ' + esc(c.end) : ''}</div>
        ${c.h24 ? '<span class="tag ok">Aberto 24 horas</span>' : c.horario ? `<span class="tag warn">Horário: ${esc(c.horario)}</span>` : '<span class="tag warn">Horário não informado, ligue antes</span>'}
        <div class="acts">
          <a href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}" target="_blank" rel="noopener">📍 Rota</a>
          ${c.tel ? `<a class="call" href="tel:${c.tel.replace(/[^\d+]/g,'')}">📞 Ligar</a>` : ''}
        </div>
      </div></div>`).join('')}</div>`
      : `<div class="card"><div class="empty">Não encontrei clínicas cadastradas no mapa aberto num raio de 15 km. Use o botão do Google Maps acima.</div></div>`;
  }
  const gmaps = s.lat ? `https://www.google.com/maps/search/veterin%C3%A1rio+24+horas/@${s.lat},${s.lng},14z`
                      : `https://www.google.com/maps/search/veterin%C3%A1rio+24+horas+perto+de+mim`;
  return `<h2 style="margin:0 4px 6px">Veterinários 24 horas</h2>
  <p class="note" style="margin:0 4px 14px">Em emergência, ligue antes de sair para confirmar que estão atendendo.</p>
  <a class="btn" href="${gmaps}" target="_blank" rel="noopener" style="text-decoration:none">🗺️ Abrir "veterinário 24 horas" no Google Maps</a>
  <button class="btn ghost" style="margin-top:10px" onclick="buscarClinicas()">📍 Usar minha localização</button>
  <form onsubmit="buscarPorEndereco(event)" style="display:flex;gap:8px;margin-top:10px">
    <input id="endBusca" value="${esc(s.busca||'')}" placeholder="Ou digite bairro, cidade ou CEP" enterkeyhint="search"
      style="flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px">
    <button class="btn" style="width:auto;padding:12px 16px">Buscar</button>
  </form>
  <div style="margin-top:14px">${corpo}</div>
  ${s.status==='done' ? '<p class="note">Lista do OpenStreetMap: as 24 horas aparecem primeiro. Nem toda clínica informa horário no mapa, então o Google Maps costuma ser mais completo.</p>' : ''}`;
}

/* ---------- clínicas próximas ---------- */
function distKm(a,b,c,d){ const R=6371, r=x=>x*Math.PI/180;
  const h = Math.sin(r(c-a)/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)); }

const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const AJUDA_LOC = ehIOS
  ? 'No iPhone: Ajustes → Privacidade e Segurança → Serviços de Localização (ligado) → Sites do Safari → "Durante o Uso". Depois feche e abra o app de novo.'
  : 'No Android: Configurações → Localização (ligada). Depois, no Chrome: menu ⋮ → Configurações → Configurações do site → Local → libere este site. Feche e abra o app de novo.';

function buscarClinicas(){
  if(!navigator.geolocation){ clinState = {...clinState, status:'error', list:[], msg:'Este aparelho não informa a localização. Digite seu bairro, cidade ou CEP acima.', ajuda:''}; return render(); }
  clinState = {...clinState, status:'loading', msg:'Pegando sua localização…', ajuda:''}; render();
  navigator.geolocation.getCurrentPosition(
    pos => buscarPorCoords(pos.coords.latitude, pos.coords.longitude),
    err => {
      const msg = err.code === 1
        ? 'A localização está bloqueada para o app. Digite seu bairro, cidade ou CEP acima, ou libere a localização:'
        : 'Não consegui achar sua localização agora (sinal fraco ou GPS desligado). Digite seu bairro, cidade ou CEP acima.';
      clinState = {...clinState, status:'error', msg, ajuda: err.code === 1 ? AJUDA_LOC : ''};
      render();
    },
    {enableHighAccuracy:false, timeout:20000, maximumAge:300000});
}

async function buscarPorEndereco(ev){
  ev.preventDefault();
  const txt = (document.getElementById('endBusca').value || '').trim();
  if(!txt) return;
  clinState = {...clinState, status:'loading', msg:'Procurando o endereço…', ajuda:'', busca: txt}; render();
  try{
    const termo = /^\d{5}-?\d{3}$/.test(txt) ? txt.replace(/^(\d{5})-?(\d{3})$/, '$1-$2') : txt;
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&accept-language=pt-BR&q=' + encodeURIComponent(termo));
    const j = await r.json();
    if(!j.length){ clinState = {...clinState, status:'error', msg:'Não encontrei esse lugar. Tente "bairro, cidade" (ex.: Moema, São Paulo).', ajuda:''}; return render(); }
    buscarPorCoords(Number(j[0].lat), Number(j[0].lon));
  }catch(e){
    clinState = {...clinState, status:'error', msg:'Não consegui buscar agora. Verifique a internet ou use o botão do Google Maps.', ajuda:''}; render();
  }
}

async function buscarPorCoords(lat, lng){
  clinState = {...clinState, lat, lng, status:'loading', msg:'Procurando clínicas por perto…', ajuda:''}; render();
  const q = `[out:json][timeout:25];(nwr["amenity"="veterinary"](around:15000,${lat},${lng}););out center tags;`;
  try{
    const r = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data=' + encodeURIComponent(q),
      headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    if(!r.ok) throw new Error();
    const j = await r.json();
    const list = j.elements.map(e => {
      const t = e.tags || {}, la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon;
      const oh = t.opening_hours || '';
      const end = [t['addr:street'], t['addr:housenumber']].filter(Boolean).join(', ') || t['addr:suburb'] || '';
      return {nome: t.name || 'Clínica veterinária', lat:la, lng:lo, dist: distKm(lat,lng,la,lo),
        h24: /24\/7|00:00-24:00|24 ?h/i.test(oh), horario: oh, tel: t.phone || t['contact:phone'] || '', end};
    }).filter(c => c.lat).sort((a,b) => (b.h24 - a.h24) || (a.dist - b.dist)).slice(0, 25);
    clinState = {...clinState, status:'done', list};
  }catch(e){
    clinState = {...clinState, status:'error', msg:'Não consegui buscar a lista agora. O botão do Google Maps continua funcionando.', ajuda:''};
  }
  render();
}

/* ---------- formulários ---------- */
const $bg = document.getElementById('sheetBg'), $sheet = document.getElementById('sheet');
function abrir(html){ $sheet.innerHTML = html; $bg.classList.add('open'); }
function fechar(){ $bg.classList.remove('open'); }
$bg.addEventListener('click', e => { if(e.target === $bg) fechar(); });

function campo(c, v){
  const val = esc(v ?? '');
  const hint = c.hint ? `<small>${c.hint}</small>` : '';
  if(c.t === 'area') return `<label class="f"><span>${c.l}</span><textarea name="${c.k}" placeholder="${c.ph||''}">${val}</textarea>${hint}</label>`;
  if(c.t === 'select') return `<label class="f"><span>${c.l}</span><select name="${c.k}">${c.op.map(o => `<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></label>`;
  return `<label class="f"><span>${c.l}${c.req?'':' <small>(opcional)</small>'}</span><input name="${c.k}" type="${c.t||'text'}" ${c.t==='number'?'step="0.01" inputmode="decimal"':''} value="${val}" placeholder="${c.ph||''}" ${c.req?'required':''}>${hint}</label>`;
}

let fotoTemp = null;
function formPet(id){
  const p = id ? db.pets.find(x => x.id === id) : {};
  fotoTemp = p.foto || null;
  abrir(`<h3>${id ? 'Editar perfil' : 'Novo pet'}</h3>
  <form id="fp">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
      <div class="photo" id="fotoPrev">${fotoTemp ? `<img src="${fotoTemp}">` : PAW}</div>
      <label class="btn ghost" style="flex:1">📷 ${fotoTemp ? 'Trocar foto' : 'Escolher foto'}
        <input type="file" accept="image/*" id="fotoIn" class="hidden"></label>
    </div>
    ${campo({k:'nome', l:'Nome', req:1, ph:'Ex.: Thor'}, p.nome)}
    <label class="f"><span>Espécie</span><select name="especie">${['Cachorro','Gato','Outro'].map(o => `<option ${o===p.especie?'selected':''}>${o}</option>`).join('')}</select></label>
    ${campo({k:'raca', l:'Raça', ph:'Ex.: Vira-lata, Shih-tzu'}, p.raca)}
    ${campo({k:'nascimento', l:'Data de nascimento', t:'date', hint:'Se não souber o dia exato, coloque uma data aproximada'}, p.nascimento)}
    <div class="row"><button type="button" class="btn ghost" onclick="fechar()">Cancelar</button><button class="btn">Salvar</button></div>
    ${id ? `<button type="button" class="danger-link" onclick="apagarPet('${id}')">Apagar este pet</button>` : ''}
  </form>`);
  document.getElementById('fotoIn').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ fotoTemp = await lerFoto(f); document.getElementById('fotoPrev').innerHTML = `<img src="${fotoTemp}">`; }
    catch(_){ alert('Não consegui abrir essa imagem.'); }
  };
  document.getElementById('fp').onsubmit = e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if(id) Object.assign(p, d, {foto: fotoTemp});
    else { const n = {id: uid(), ...d, foto: fotoTemp, registros: []}; db.pets.push(n); db.atual = n.id; tab = 'inicio'; }
    save(); fechar(); render();
  };
}
function apagarPet(id){
  const p = db.pets.find(x => x.id === id);
  if(!confirm(`Apagar ${p.nome} e todo o histórico? Isso não pode ser desfeito.`)) return;
  db.pets = db.pets.filter(x => x.id !== id); db.atual = db.pets[0]?.id || null;
  save(); fechar(); tab = 'inicio'; render();
}

function formReg(tipo, id){
  const T = TIPOS[tipo], p = pet();
  const r = id ? p.registros.find(x => x.id === id) : {data: new Date().toLocaleDateString('en-CA')};
  abrir(`<h3>${T.e} ${id ? 'Editar' : 'Nova'} ${T.nome.toLowerCase()}</h3>
  <form id="fr">${T.campos.map(c => campo(c, r[c.k])).join('')}
    <div class="row"><button type="button" class="btn ghost" onclick="fechar()">Cancelar</button><button class="btn">Salvar</button></div>
    ${id ? `<button type="button" class="danger-link" onclick="apagarReg('${id}')">Apagar registro</button>` : ''}
  </form>`);
  document.getElementById('fr').onsubmit = e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if(id) Object.assign(r, d); else p.registros.push({id: uid(), tipo, ...d});
    save(); fechar(); render();
  };
}
function apagarReg(id){
  if(!confirm('Apagar este registro?')) return;
  const p = pet(); p.registros = p.registros.filter(x => x.id !== id);
  save(); fechar(); render();
}

/* ---------- navegação e backup ---------- */
function ir(t){ tab = t; render(); window.scrollTo(0,0); }
function trocaPet(id){ db.atual = id; save(); render(); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => ir(b.dataset.tab));

function exportar(){
  const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `caderneta-pet-backup-${new Date().toLocaleDateString('en-CA')}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importar(){ document.getElementById('importFile').click(); }
document.getElementById('importFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!Array.isArray(d.pets)) throw 0;
      if(db.pets.length && !confirm('Isso vai substituir os dados atuais pelos do backup. Continuar?')) return;
      db = d; db.atual = db.atual || db.pets[0]?.id; save(); tab = 'inicio'; render();
    }catch(_){ alert('Esse arquivo não parece um backup da Caderneta do Pet.'); }
  };
  fr.readAsText(f); e.target.value = '';
};

if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
